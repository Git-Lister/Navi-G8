[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-agent"
version = "0.1.0"
description = "Agent Core for Navi-G8 – a cognitive, self-improving field interface"
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
    "structlog>=24.0.0",
    # "tomli" removed – built into Python 3.12+
    "pydantic>=2.0.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "networkx>=3.0.0",
    "pandas>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
watchdog = ["watchdog>=4.0.0"]  # Moved to optional

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["navi_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]